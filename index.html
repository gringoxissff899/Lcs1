    <script>
(function() {
    'use strict';
    
    const gameConfig = JSON.parse(document.getElementById('gameConfig').textContent);
    
    // KEY
    const KEY = "LCS-AIMBOT";
    
    // CANVAS
    const c = document.getElementById('bgCanvas');
    const ctx = c.getContext('2d');
    
    function resize() {
        c.width = window.innerWidth;
        c.height = window.innerHeight;
    }
    resize();
    window.onresize = resize;
    
    const ps = [];
    for (let i = 0; i < 60; i++) {
        ps.push({
            x: Math.random() * c.width,
            y: Math.random() * c.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5,
            r: Math.random() * 2 + 1
        });
    }
    
    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#888';
        ctx.strokeStyle = '#888';
        ctx.lineWidth = 1;
        
        ps.forEach((p, i) => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > c.width) p.vx *= -1;
            if (p.y < 0 || p.y > c.height) p.vy *= -1;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
            
            for (let j = i + 1; j < ps.length; j++) {
                const p2 = ps[j];
                const dx = p.x - p2.x;
                const dy = p.y - p2.y;
                const d = Math.sqrt(dx * dx + dy * dy);
                if (d < 120) {
                    ctx.globalAlpha = (120 - d) / 120 * 0.3;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                    ctx.globalAlpha = 1;
                }
            }
        });
        requestAnimationFrame(draw);
    }
    draw();
    
    // LOGIN
    const ls = document.getElementById('loginScreen');
    const pn = document.getElementById('panelScreen');
    const pf = document.getElementById('passwordField');
    const lb = document.getElementById('loginBtn');
    
    function login() {
        if (pf.value.trim() === KEY) {
            ls.classList.add('hidden');
            pn.classList.remove('hidden');
        } else {
            pf.value = '';
            pf.placeholder = 'Key inválida!';
            pf.classList.add('shake');
            setTimeout(() => {
                pf.classList.remove('shake');
                pf.placeholder = 'Key';
            }, 500);
        }
    }
    
    lb.onclick = login;
    pf.onkeypress = e => { if (e.key === 'Enter') login(); };
    
    // TABS
    const tf = document.getElementById('tabFun');
    const ti = document.getElementById('tabInfo');
    const fc = document.getElementById('funContent');
    const ic = document.getElementById('infoContent');
    
    tf.onclick = () => {
        tf.classList.add('active');
        ti.classList.remove('active');
        fc.style.display = 'block';
        ic.style.display = 'none';
    };
    
    ti.onclick = () => {
        ti.classList.add('active');
        tf.classList.remove('active');
        ic.style.display = 'block';
        fc.style.display = 'none';
    };
    
    // CHECKS
    const st = {maxPrecision: false, norecoil: false, melhorarMira: false};
    document.querySelectorAll('.checkbox').forEach(cb => {
        cb.onclick = () => {
            const k = cb.getAttribute('data-key');
            st[k] = !st[k];
            cb.classList.toggle('checked', st[k]);
        };
    });
    
    // SLIDER
    const sl = document.getElementById('slider');
    const pv = document.getElementById('precVal');
    sl.oninput = () => pv.textContent = sl.value;
    
    // DROPDOWN
    const ab = document.getElementById('auxBtn');
    const ad = document.getElementById('auxDropdown');
    let aux = '';
    
    ab.onclick = () => ad.classList.toggle('open');
    
    document.querySelectorAll('.aux-item').forEach(it => {
        it.onclick = () => {
            aux = it.getAttribute('data-val');
            ab.textContent = aux;
            ab.style.color = '#fff';
            ad.classList.remove('open');
        };
    });
    
    document.onclick = e => {
        if (!ab.contains(e.target) && !ad.contains(e.target)) {
            ad.classList.remove('open');
        }
    };
    
    // INJECT - ABRE FF DIRETO
    const inj = document.getElementById('injectBtn');
    inj.onclick = () => {
        const af = [];
        if (st.maxPrecision) af.push('Máximo de Precisão');
        if (st.norecoil) af.push('Norecoil');
        if (st.melhorarMira) af.push('Melhor Mira');
        
        if (af.length === 0 && !aux) {
            alert('⚠️ Selecione pelo menos uma função!');
            return;
        }
        
        inj.textContent = 'INJETANDO...';
        inj.disabled = true;

        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
        const isAndroid = /Android/i.test(ua);

        if (isAndroid) {
            const androidUrls = [
                'intent://launch#Intent;scheme=freefire;package=com.dts.freefireth;end',
                'intent://launch#Intent;scheme=freefiremax;package=com.dts.freefiremax;end',
                'freefire://'
            ];
            let idx = 0;
            const tryNext = () => {
                if (idx < androidUrls.length) {
                    window.location.href = androidUrls[idx++];
                    setTimeout(tryNext, 400);
                }
            };
            tryNext();
        } else if (isIOS) {
            const iosUrls = ['freefire://', 'freefiremax://', 'ff://'];
            let idx = 0;
            const tryNext = () => {
                if (idx < iosUrls.length) {
                    window.location.href = iosUrls[idx++];
                    setTimeout(tryNext, 400);
                }
            };
            tryNext();
        } else {
            window.location.href = 'freefire://';
        }

        setTimeout(() => {
            let msg = '✅ Funções injetadas!\n\n';
            if (af.length) {
                msg += '📋 Funções:\n';
                af.forEach(f => msg += `  • ${f}\n`);
            }
            if (aux) msg += `\n🎯 Auxílio: ${aux}`;
            msg += `\n\n⚙️ Precisão: ${sl.value}`;
            alert(msg);
            inj.textContent = 'INJETAR FUNÇÕES NO JOGO';
            inj.disabled = false;
        }, 1800);
    };
})();
